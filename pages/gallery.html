<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — On the Thread of Time</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>

  <div id="header-placeholder"></div>


  <main class="page-container">
    <h1>The Gallery</h1>
    <p style="margin: var(--space-sm) 0 var(--space-lg); opacity: 0.8;">
      moments of the journey.
    </p>

    <section class="gallery-section">
      <h2>Fanart</h2>
      <div class="gallery-grid">

        <div class="gallery-item">
          <img src="../assets/images/gallery/fanart-placeholder.jpg" alt="Fanart placeholder">
          <p class="gallery-caption">[Artist name / description]</p>
        </div>

        <!-- Duplicate the .gallery-item block above for each fanart piece -->

      </div>
    </section>

    <section class="gallery-section">
      <h2>Battles</h2>
      <div class="gallery-grid">

        <div class="gallery-item">
          <img src="../assets/images/gallery/battle-placeholder.jpg" alt="Battle screenshot placeholder">
          <p class="gallery-caption">[Battle description / session date]</p>
        </div>

        <!-- Duplicate the .gallery-item block above for each battle image -->

      </div>
    </section>

    <section class="gallery-section">
      <h2>Videos</h2>
      <div class="video-grid">

        <div class="video-item">
          <iframe src="https://www.youtube.com/embed/VIDEO_ID_HERE" title="Video placeholder" allowfullscreen></iframe>
          <p class="video-caption">[Video title / description]</p>
        </div>

        <!-- Duplicate the .video-item block above for each video -->

      </div>
    </section>

  </main>

  <div id="footer-placeholder"></div>
  <script src="/js/include-partials.js"></script>
</body>
</html>
