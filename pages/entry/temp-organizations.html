<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Organization — On the Thread of Time</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>

  <div id="header-placeholder"></div>

  <main class="page-container">

    <div class="entry-header">
      <div class="entry-portrait-large">
        <img id="org-portrait" src="" alt="">
      </div>
      <div class="entry-header-info">
        <h1 class="entry-name" id="org-name"></h1>
        <p class="entry-epithet" id="org-type"></p>
        <div class="entry-tags">
          <span class="entry-tag" id="org-headquarters"></span>
          <span class="entry-tag" id="org-leader"></span>
        </div>
      </div>
    </div>

    <div class="entry-section">
      <h2>Description</h2>
      <p id="org-description"></p>
    </div>

    <div class="entry-section">
      <h2>Goals & Purpose</h2>
      <p id="org-goals"></p>
    </div>

    <div class="entry-section">
      <h2>Notable Members</h2>
      <p id="org-notable-members"></p>
    </div>

  </main>

  <div id="footer-placeholder"></div>
  <script src="/js/include-partials.js"></script>
  <script src="/js/organization-loader.js"></script>
</body>
</html>
